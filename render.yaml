services:
  - type: web
    name: buildcycle-ai-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install --upgrade pip && pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: MODEL_PATH
        value: models/best.pt
      - key: MODEL_NAME
        value: construction-waste-yolo
      - key: MODEL_CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: MODEL_IOU_THRESHOLD
        value: "0.45"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: GEMINI_ENABLED
        value: "false"
